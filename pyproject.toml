[project]
name = "blackbox-jury"
version = "0.1.0"
description = "Security testing and verification for tool-using AI agents (hackathon MVP)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blackbox_jury"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Docs are not code; keep ruff from reformatting code blocks inside Markdown.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "sandbox_images/gateway/bbj_gateway", "sandbox_images/refundbot/bbj_refundbot"]
mypy_path = ["src", "sandbox_images/gateway", "sandbox_images/refundbot"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import from src/ directly; do not depend on the editable-install .pth file
# (macOS may flag it hidden, and Python 3.12.15+ skips hidden .pth files).
pythonpath = ["src", "sandbox_images/gateway", "sandbox_images/refundbot"]
filterwarnings = [
    # Known, accepted: Starlette 1.10's TestClient prefers the new `httpx2` package
    # but still fully supports `httpx` (it falls back and warns). Switching means
    # adopting a new, not-yet-vetted dependency, so we keep `httpx` (dev-only) for now.
    # Scoped to this exact message so any other deprecation still surfaces.
    # Revisit when upgrading Starlette/FastAPI. See README "Known issues".
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
addopts = "-ra --strict-markers"
markers = [
    "docker: requires a running Docker daemon (sandbox integration tests)",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
